
services:
  audion-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - AUDION_DATA_DIR=/data
      - AUDION_PORT=8080
      - RUST_LOG=info
      - AUDION_JWT_EXPIRATION_DAYS=7
      - AUDION_CORS_ORIGIN=*
      - AUDION_MAX_BODY_SIZE=262144000
      - PUID=10001
      - PGID=10001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  audion-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      audion-server:
        condition: service_healthy
    restart: unless-stopped
