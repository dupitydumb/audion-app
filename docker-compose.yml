
services:
  audion:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - AUDION_DATA_DIR=/data
      - AUDION_PORT=8080
      - RUST_LOG=info
      - AUDION_JWT_EXPIRATION_DAYS=7
      - AUDION_CORS_ORIGIN=*
      - AUDION_MAX_BODY_SIZE=262144000
      - PUID=10001
      - PGID=10001
    restart: unless-stopped
