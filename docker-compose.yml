
services:
  audion:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AUDION_PORT:-8086}:8086"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
